<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <title>AgentTrust high-level architecture</title>
  <desc>Flow from user delegation to agent, independent policy gateway, mock merchant, signed receipt chain and verification and recovery, with evidence levels and what is not proven.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">AgentTrust: 위임, 검사, 기록, 검증</text>
  <text x="20" y="56" font-size="12" fill="#475569">로컬 연구용 프로토타입. 가상 데이터와 모의 가맹점 사용. 실제 결제 없음. 승인 경로에는 결정론적 코드만 사용.</text>

  <!-- row of stages -->
  <g font-size="13" fill="#0f172a">
    <g><rect x="20" y="90" width="170" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="105" y="114" text-anchor="middle" font-weight="700">1. 사용자</text>
      <text x="105" y="136" text-anchor="middle" font-size="12">위임을 생성합니다:</text>
      <text x="105" y="153" text-anchor="middle" font-size="12">예산, 가맹점,</text>
      <text x="105" y="170" text-anchor="middle" font-size="12">카테고리, 반품,</text>
      <text x="105" y="187" text-anchor="middle" font-size="12">만료 조건을 정하고</text>
      <text x="105" y="204" text-anchor="middle" font-size="12">데모 신뢰 화면에서 승인</text></g>

    <g><rect x="218" y="90" width="170" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="303" y="114" text-anchor="middle" font-weight="700">2. 위임</text>
      <text x="303" y="136" text-anchor="middle" font-size="12">버전을 관리하며 승인 후</text>
      <text x="303" y="153" text-anchor="middle" font-size="12">수정할 수 없습니다.</text>
      <text x="303" y="170" text-anchor="middle" font-size="12">만료와 철회는 게이트웨이</text>
      <text x="303" y="187" text-anchor="middle" font-size="12">시간 기준으로 강제합니다.</text>
      <text x="303" y="204" text-anchor="middle" font-size="12"></text></g>

    <g><rect x="416" y="90" width="170" height="130" rx="10" fill="#fef3c7" stroke="#d97706"/>
      <text x="501" y="114" text-anchor="middle" font-weight="700">3. AI 에이전트</text>
      <text x="501" y="136" text-anchor="middle" font-size="12">신뢰하지 않습니다. 행동 요청,</text>
      <text x="501" y="153" text-anchor="middle" font-size="12">멱등성 키와 자체 주장을</text>
      <text x="501" y="170" text-anchor="middle" font-size="12">함께 전송합니다. 자체 주장은</text>
      <text x="501" y="187" text-anchor="middle" font-size="12"></text>
      <text x="501" y="204" text-anchor="middle" font-size="12">(SELF_REPORTED)로 표시합니다.</text></g>

    <g><rect x="614" y="90" width="170" height="130" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
      <text x="699" y="114" text-anchor="middle" font-weight="700">4. 정책 게이트웨이</text>
      <text x="699" y="136" text-anchor="middle" font-size="12">ALLOW / DENY /</text>
      <text x="699" y="153" text-anchor="middle" font-size="12">REQUIRE_APPROVAL 결정.</text>
      <text x="699" y="170" text-anchor="middle" font-size="12">가맹점 서명 견적을 기준으로</text>
      <text x="699" y="187" text-anchor="middle" font-size="12">한도를 확인합니다.</text>
      <text x="699" y="204" text-anchor="middle" font-size="12">예산을 원자적으로 예약합니다.</text></g>

    <g><rect x="812" y="90" width="170" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="897" y="114" text-anchor="middle" font-weight="700">5. 모의 가맹점</text>
      <text x="897" y="136" text-anchor="middle" font-size="12">시뮬레이션으로 견적, 주문,</text>
      <text x="897" y="153" text-anchor="middle" font-size="12">취소에 자체 데모 키로</text>
      <text x="897" y="170" text-anchor="middle" font-size="12">서명합니다.</text>
      <text x="897" y="187" text-anchor="middle" font-size="12">오류 주입: 가격 불일치,</text>
      <text x="897" y="204" text-anchor="middle" font-size="12">가맹점 오류, 응답 시간 초과</text></g>

    <g><rect x="1010" y="90" width="170" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/>
      <text x="1095" y="114" text-anchor="middle" font-weight="700">6. 행동 영수증</text>
      <text x="1095" y="136" text-anchor="middle" font-size="12">Canonical JSON, SHA-256</text>
      <text x="1095" y="153" text-anchor="middle" font-size="12">해시 체인, Ed25519</text>
      <text x="1095" y="170" text-anchor="middle" font-size="12">서명. 각 결정, 실행 결과,</text>
      <text x="1095" y="187" text-anchor="middle" font-size="12">취소, 분쟁마다 영수증을</text>
      <text x="1095" y="204" text-anchor="middle" font-size="12">하나씩 기록합니다.</text></g>
  </g>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
    <path d="M190 155H214"/><path d="M388 155H412"/><path d="M586 155H610"/><path d="M784 155H808"/><path d="M982 155H1006"/>
  </g>

  <!-- gateway internals -->
  <rect x="20" y="256" width="560" height="180" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
  <text x="36" y="280" font-size="14" font-weight="700" fill="#0f172a">게이트웨이 처리 순서 (SQLite 단일 쓰기 트랜잭션)</text>
  <g font-size="12" fill="#1e293b">
    <text x="36" y="304">1. 멱등성 확인. 같은 키와 같은 요청이면 저장된 결과를 반환합니다.</text>
    <text x="36" y="324">    같은 키에 다른 요청이 오면 거부합니다 (409).</text>
    <text x="36" y="344">2. 가맹점 서명 견적을 가져와 검증합니다. 가격은 에이전트가 아니라</text>
    <text x="36" y="362">    견적에서 가져옵니다.</text>
    <text x="36" y="382">3. 순수 정책 함수가 한도, 허용 목록, 중복 요청, 위임 상태 등 모든 위반을</text>
    <text x="36" y="400">    수집합니다. 예산을 예약하고 POLICY_DECISION을 기록합니다.</text>
    <text x="36" y="420">4. 커밋 후 가맹점을 호출하고 EXECUTED, DISCREPANCY, FAILED 또는 UNKNOWN을 기록합니다.</text>
  </g>

  <!-- verification & recovery -->
  <rect x="610" y="256" width="570" height="180" rx="10" fill="#fafafa" stroke="#cbd5e1"/>
  <text x="626" y="280" font-size="14" font-weight="700" fill="#0f172a">7. 사후 검증 및 복구</text>
  <g font-size="12" fill="#1e293b">
    <text x="626" y="304">오프라인 검증기는 공개키만으로 해시, 서명, 체인 연결, 순서를 확인합니다.</text>
    <text x="626" y="324">영수증 탐색기는 검증 가능한 증거와 미검증 주장을 구분해 보여줍니다.</text>
    <text x="626" y="344">분쟁 분석은 실패 단계, 위반 조건, 출처 간 불일치,</text>
    <text x="626" y="362">    당사자별 증거, 확정되지 않은 사실을 보여줍니다.</text>
    <text x="626" y="382">복구는 모의 가맹점을 통한 취소 요청입니다. 가맹점이 거절할 수 있습니다.</text>
    <text x="626" y="402">책임은 항상 NOT_DETERMINED입니다. 환불, 차지백, 보험금 지급 기능은 없습니다.</text>
  </g>
  <path d="M1095 220V238H895V256" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- evidence levels -->
  <text x="20" y="474" font-size="14" font-weight="700" fill="#0f172a">모든 영수증에 표시되는 증거 등급</text>
  <g font-size="12">
    <rect x="20" y="486" width="230" height="52" rx="8" fill="#fef3c7" stroke="#d97706"/><text x="135" y="508" text-anchor="middle" font-weight="700" fill="#78350f">SELF_REPORTED</text><text x="135" y="526" text-anchor="middle" fill="#78350f">에이전트 또는 사용자의 주장</text>
    <rect x="270" y="486" width="230" height="52" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="385" y="508" text-anchor="middle" font-weight="700" fill="#312e81">GATEWAY_VERIFIED</text><text x="385" y="526" text-anchor="middle" fill="#312e81">결정론적 코드로 검증</text>
    <rect x="520" y="486" width="230" height="52" rx="8" fill="#ccfbf1" stroke="#0d9488"/><text x="635" y="508" text-anchor="middle" font-weight="700" fill="#134e4a">MERCHANT_CONFIRMED</text><text x="635" y="526" text-anchor="middle" fill="#134e4a">모의 가맹점 서명</text>
    <rect x="770" y="486" width="190" height="52" rx="8" fill="#f1f5f9" stroke="#64748b"/><text x="865" y="508" text-anchor="middle" font-weight="700" fill="#334155">UNKNOWN</text><text x="865" y="526" text-anchor="middle" fill="#334155">결과 미확정</text>
    <rect x="980" y="486" width="200" height="52" rx="8" fill="#ffffff" stroke="#dc2626" stroke-dasharray="5 4"/><text x="1080" y="508" text-anchor="middle" font-weight="700" fill="#991b1b">PAYMENT_CONFIRMED</text><text x="1080" y="526" text-anchor="middle" fill="#991b1b">발급되지 않으며 검증기가 거부</text>
  </g>

  <!-- not proven -->
  <rect x="20" y="570" width="1160" height="112" rx="10" fill="#fff1f2" stroke="#e11d48"/>
  <text x="36" y="594" font-size="14" font-weight="700" fill="#9f1239">이 프로토타입이 증명하지 않는 것</text>
  <g font-size="12" fill="#4c0519">
    <text x="36" y="616">사용자 서명 아님: 데모 화면의 클릭이며 사용자가 승인했다는 암호학적 증거가 없습니다.</text>
    <text x="36" y="634">제3자 독립성 없음: 하나의 게이트웨이 키가 모든 내용에 서명합니다. 운영자는 다시 서명할 수 있고, 마지막 영수증 삭제나 오래된 export 재사용은 탐지할 수 없습니다.</text>
    <text x="36" y="652">실제 가맹점·결제 증거 아님: 가맹점 서명은 시뮬레이션이며 결제 제공자가 없습니다. AP2 호환 또는 인증을 받지 않았습니다.</text>
    <text x="36" y="670">법적 판단 아님: 책임 판정, 환불 보장, 보험이 없습니다.</text>
  </g>
</svg>
